providerId: anyimagedetector
generated: '2026-08-11'
method: searched
source: https://imagedetector.online/pricing
docs: https://imagedetector.online/pricing
currency: USD
description: >-
  AnyImageDetector prices in monthly detection allowances, sold as four self-service tiers plus
  a contact-sales Enterprise tier. The unit is one image detection = 1 credit, drawn from a
  single balance shared between the web tool and the API. API ACCESS IS A PAID FEATURE: the
  Free tier is web-only and cannot create API keys, which the API reference states explicitly.
  Annual billing is offered at a flat 20% discount on every paid tier.
access_model:
  pricing: paid
  free_tier: true
  free_tier_api_access: false
  onboarding: self-service (paid plan required before an API key can be created)
plan_count: 5
