overage:
  policy: not published
  note: >-
    The pricing FAQ poses "What happens if I run out of checks mid-month?" but the answer is not
    exposed in the served HTML. The API's own behaviour on exhaustion is documented: 402
    insufficient_credits. No published overage rate.
refunds:
  policy: >-
    Terms of Service state refunds are "handled on a case-by-case basis in line with our refund
    policy"; no standalone refund policy page is published.
  source: https://imagedetector.online/terms-of-service
