name: AnyImageDetector
description: >-
  AnyImageDetector (imagedetector.online) is a single-purpose AI-image-detection service for
  individuals, trust-and-safety reviewers, journalists and developers. Its AI Image Detector API
  exposes one REST endpoint, POST /v1/image/detect, that accepts a JPG/PNG/WebP file up to 8 MB
  or a public image URL and returns a verdict (likely_ai, likely_human or uncertain), an
  ai_score from 0 to 1, a confidence label, and a source_breakdown array reserved for future
  per-generator scores. The provider publishes the exact score bands that map ai_score to
  verdict and confidence, and deliberately declines to publish a single accuracy percentage,
  stating that one number would hide differences between generators, image styles, resolutions
  and editing conditions. Authentication is a static sk_ API key sent as a Bearer token or an
  x-api-key header; API access requires a paid plan and each successful detection consumes one
  credit from the same balance as the web tool. Requests are limited to one per second per key,
  with Retry-After returned on 429.
