apis:
  - name: AI Image Detector API
    description: >-
      REST API with a single endpoint (POST /v1/image/detect) that detects whether an image is
      AI-generated. Accepts a multipart file upload (JPG, PNG or WebP, up to 8 MB) or a JSON
      body with a public image URL, and returns verdict, ai_score, confidence, and
      source_breakdown. Requires a paid account and Bearer/x-api-key authentication; one
      credit per successful detection; one request per second per API key.
